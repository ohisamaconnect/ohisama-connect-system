name: MEMBER VOICES validation

on:
  workflow_dispatch:
  push:
    paths:
      - "member_voices/**"
      - ".github/workflows/member-voices-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install "jsonschema>=4.20,<5"
      - name: Validate implementation and Preview
        run: python member_voices/tests/validate_member_voices_impl.py
      - name: Validate incremental runner
        run: python member_voices/tests/validate_incremental_runner.py
      - name: Validate semantic extractor boundary
        run: python member_voices/tests/validate_semantic_extractor_boundary.py

      - name: Validate semantic provider contract
        run: python member_voices/tests/validate_semantic_provider_contract.py
      - name: Validate semantic provider evaluator
        run: python member_voices/tests/validate_semantic_provider_eval.py

      - name: Validate Apps Script provider eval runner contract
        run: python member_voices/tests/validate_gas_eval_runner_contract.py

      - name: Validate recovered Calibration assets
        run: python member_voices/tests/validate_calibration_recovery_assets.py
